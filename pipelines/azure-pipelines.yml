# Szkielet pipeline'u Azure DevOps.
# L1: dziala sama czesc CI (styl kodu, testy, budowa obrazu) - bez zasobow w chmurze.
# L5: dojdzie publikacja obrazu do ACR i wdrozenie.
# L6: dojda kroki bezpieczenstwa (SAST, skan obrazu, DAST, sekrety z Key Vault).

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements-dev.txt
    displayName: Instalacja zaleznosci

  - script: ruff check app tests scripts
    displayName: Styl kodu (ruff)

  - script: pytest --junitxml=test-results.xml
    displayName: Testy

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: test-results.xml

  - script: docker build -t secforum:$(Build.BuildId) .
    displayName: Budowa obrazu

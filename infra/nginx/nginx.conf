# Reverse proxy dla srodowiska lokalnego.
# W Azure (L3/L4) te role przejmie Application Gateway z WAF-em, a ten plik
# zostaje jako dokumentacja oczekiwanego zachowania warstwy brzegowej.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nie zdradzamy wersji serwera (rekonesans).
    server_tokens off;

    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Katalogi tymczasowe w /tmp, zeby kontener mogl dzialac read-only.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    log_format main '$remote_addr - $upstream_addr [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Ograniczenie tempa logowania - prosta ochrona przed brute force,
    # uzupelnienie blokady konta realizowanej w aplikacji.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    # Wbudowany DNS Dockera. Adres upstreamu jest zmienna, dzieki czemu nginx
    # odpytuje DNS cyklicznie i widzi nowe repliki po `docker compose up --scale app=N`
    # bez restartu - tak samo, jak load balancer w chmurze widzi nowe instancje.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        set $app_backend "app:8000";

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location = /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://$app_backend;
        }

        location /static/ {
            proxy_pass http://$app_backend;
            proxy_cache_bypass $http_upgrade;
            expires 1h;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://$app_backend;
        }
    }
}

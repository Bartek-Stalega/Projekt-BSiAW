# Lokalne srodowisko DEV: aplikacja + baza + Mailhog.
# Docelowo (L3/L4) app trafi do Azure Container Apps, a db do Azure Database
# for PostgreSQL - uklad uslug pozostaje ten sam.
name: secforum

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secforum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secforum_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-secforum}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secforum}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Baza nie publikuje portu na hosta - dostep tylko z sieci kontenerow.

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
    # SMTP 1025 tylko w sieci compose (app laczy sie hostem "mailhog").

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-43117}:8000"
    environment:
      APP_ENVIRONMENT: dev
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-dev-secret-change-me}
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secforum}:${POSTGRES_PASSWORD:-secforum_local_dev}@db:5432/${POSTGRES_DB:-secforum}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:43117}
      APP_SMTP_HOST: mailhog
      APP_SMTP_PORT: "1025"
      APP_SMTP_FROM: ${APP_SMTP_FROM:-noreply@folium.local}
      APP_UPLOAD_DIR: /srv/uploads
    volumes:
      - uploads-data:/srv/uploads
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  db-data:
  uploads-data:

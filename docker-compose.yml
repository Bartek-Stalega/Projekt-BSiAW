# Lokalne srodowisko DEV. Odwzorowuje docelowa architekture z Azure:
#   nginx  -> odpowiednik Application Gateway / Front Door (terminacja TLS, WAF)
#   app    -> odpowiednik Container Apps / App Service (skalowane horyzontalnie)
#   db     -> odpowiednik Azure Database for PostgreSQL Flexible Server
name: secforum

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secforum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secforum_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-secforum}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secforum} -d ${POSTGRES_DB:-secforum}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    # Baza nie publikuje portu na hosta - dostep tylko z sieci kontenerow.

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: dev
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-dev-secret-change-me}
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secforum}:${POSTGRES_PASSWORD:-secforum_local_dev}@db:5432/${POSTGRES_DB:-secforum}
      APP_COOKIE_SECURE: "false"
      APP_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Skalowanie poziome do testow: docker compose up --scale app=3
    expose:
      - "8000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-43117}:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:

networks:
  edge:
  backend:
    internal: true

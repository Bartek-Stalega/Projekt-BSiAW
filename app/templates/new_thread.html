{% extends "base.html" %}
{% block title %}Nowy watek &middot; {{ app_name }}{% endblock %}

{% block content %}
<nav class="breadcrumb"><a href="/">&larr; Wszystkie watki</a></nav>

<section class="panel">
  <h1>Nowy watek</h1>
  <form method="post" action="/threads/new" data-composer-root data-composer-height="380px">
    <label for="title">Tytul</label>
    <input id="title" name="title" type="text" required minlength="5" maxlength="120"
           placeholder="O czym rzad milczy?" value="{{ title or '' }}">

    <label>Tresc</label>
    <div data-toast-editor></div>
    <textarea name="body" data-composer class="composer-sync" maxlength="8000"
              placeholder="Napisz wiadomosc...">{{ body or '' }}</textarea>

    <button class="btn btn-primary" type="submit">Opublikuj watek</button>
  </form>
</section>
{% endblock %}

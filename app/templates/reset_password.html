{% extends "base.html" %}
{% block title %}Nowe haslo &middot; {{ app_name }}{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Ustaw nowe haslo</h1>
  {% if token %}
  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="password">Nowe haslo</label>
    <input id="password" name="password" type="password" required minlength="8"
           autocomplete="new-password">
    <button class="btn btn-primary btn-block" type="submit">Zapisz haslo</button>
  </form>
  {% else %}
  <p class="muted"><a href="/forgot-password">Popros o nowy link</a></p>
  {% endif %}
</section>
{% endblock %}

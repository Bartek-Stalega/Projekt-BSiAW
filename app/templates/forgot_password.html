{% extends "base.html" %}
{% block title %}Reset hasla &middot; {{ app_name }}{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Zapomnialem hasla</h1>
  <form method="post" action="/forgot-password">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required maxlength="255" autocomplete="email">
    <button class="btn btn-primary btn-block" type="submit">Wyslij link</button>
  </form>
  <p class="muted small"><a href="/login">Wroc do logowania</a></p>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Rejestracja &middot; {{ app_name }}{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Zaloz konto</h1>
  <form method="post" action="/register">
    <label for="username">Nazwa uzytkownika</label>
    <input id="username" name="username" type="text" required minlength="3" maxlength="32"
           autocomplete="username" value="{{ username or '' }}">

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required maxlength="255"
           autocomplete="email" value="{{ email or '' }}">

    <label for="password">Haslo</label>
    <input id="password" name="password" type="password" required minlength="8"
           autocomplete="new-password">

    <button class="btn btn-primary btn-block" type="submit">Zaloz konto</button>
  </form>
  <p class="muted small">Masz juz konto? <a href="/login">Zaloguj sie</a></p>
</section>
{% endblock %}

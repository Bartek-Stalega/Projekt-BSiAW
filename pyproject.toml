[project]
name = "secforum"
version = "0.1.0"
description = "Folium - forum teorii spiskowych, projekt laboratoryjny BSiAW (grupa 1)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
